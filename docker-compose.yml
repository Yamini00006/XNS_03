services:
  db:
    image: postgres:16
    container_name: customer_data_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-customer_data_platform}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: customer_data_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.backend
    container_name: customer_data_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      UPLOAD_DIR: /app/datasets/input
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    volumes:
      - ./datasets:/app/datasets

  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.backend
    container_name: customer_data_worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      UPLOAD_DIR: /app/datasets/input
    command: celery -A infrastructure.workers.celery worker --loglevel=info
    depends_on:
      - db
      - redis
    volumes:
      - ./datasets:/app/datasets

volumes:
  postgres_data: